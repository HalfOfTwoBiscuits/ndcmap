<!-- Main page, containing the map widget. -->

<#include "base.html">

<#macro other_head_data>
    <!-- Leaflet.js map widget. -->
   <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
</#macro>

<#macro page_content>
  <main>
    <div id="errors" role="alert" aria-label="Error messages"></div>
    
    <div id="map" aria-label="Map of North Devon College"></div>

    <div id="areaInfo" hidden="true" class="box" aria-label="Area Details">
      <h2 id="areaName"></h2>
      <p id="areaAltNames"></p>
      <button onclick="mapHandler.hideAreaInfoBox()">Close</button>
    </div>
  </main>
</#macro>

<@render/>
